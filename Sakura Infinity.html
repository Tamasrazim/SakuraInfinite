if(fly){const cp=Math.cos(pitch),k=sp?400:45;const fx=-sy*cp,fy=Math.sin(pitch),fz=-cy*cp;
vel.x+=((fx*fw+cy*st)*k-vel.x)*Math.min(1,dt*6);vel.y+=(fy*fw*k+((keys.Space?1:0)-(keys.KeyC?1:0))*k*.6-vel.y)*Math.min(1,dt*6);vel.z+=((fz*fw-sy*st)*k-vel.z)*Math.min(1,dt*6);
pos.addScaledVector(vel,dt);const gh=hf(pos.x,pos.z);if(pos.y<gh)pos.y=gh;grounded=false;return}
const gh0=hf(pos.x,pos.z),wade=pos.y<0&&gh0<0?.55:1,spd=(sp?15:7.5)*wade,tx=(-sy*fw+cy*st)*spd,tz=(-cy*fw-sy*st)*spd,k=Math.min(1,dt*(grounded?12:3));

if(!grounded&&keys.Space&&vel.y<-3.5)vel.y=-3.5;
pos.addScaledVector(vel,dt);treeCollide(pos,.4);
const gh=hf(pos.x,pos.z);if(pos.y<=gh&&vel.y<=0){pos.y=gh;vel.y=0;grounded=true;jumps=0}else grounded=pos.y<=gh+.05&&vel.y<=0;
if(grounded)bob+=Math.hypot(vel.x,vel.z)*dt*.9}
/* ---------- blobs: real jiggle (per-vertex spring-damper) ---------- */
const baseG=new T.IcosahedronGeometry(1,2),NV=baseG.attributes.position.count,B0=baseG.attributes.position.array,BK=new Float32Array(NV),BW=new Float32Array(NV);
for(let i=0;i<NV;i++){const a=Math.round(B0[i*3]*1e3),b=Math.round(B0[i*3+1]*1e3),c=Math.round(B0[i*3+2]*1e3);BK[i]=140+hs(a*.37+c*.11,b*.53+7)*320;BW[i]=.35+hs(c*.61,a*.44+b*.2)*.6}
const blobs=[],eyeM=M(0x2b1630),mouthM=M(0xff7799);let nextB=0;
function mkBlob(){const g=baseG.clone(),m=new T.Mesh(g,M(0xffffff));m.material.color.setHSL(Math.random(),.85,.78);m.material.emissive.copy(m.material.color).multiplyScalar(.25);m.frustumCulled=false;
const w=new T.Group(),face=new T.Group();w.add(m,face);
for(const s of[-1,1])part(sph,eyeM,[.09,.13,.05],[s*.3,.15,.9],face);part(sph,mouthM,[.1,.05,.04],[0,-.1,.93],face);
S.add(w);const b={w,m,face,p:w.position,r:1,v:new T.Vector3(),pv:new T.Vector3(),off:new Float32Array(NV*3),vv:new Float32Array(NV*3)};blobs.push(b);return b}
function place(b,x,y,z,r,v){b.r=r;b.p.set(x,y,z);b.v.copy(v);b.pv.copy(v);b.off.fill(0);b.vv.fill(0);b.face.scale.setScalar(r)}
function hit(b,nx,ny,nz,s){if(s<2)return;s=Math.min(s,25)*.35;const vv=b.vv;for(let i=0;i<NV;i++){const j=i*3,dx=B0[j],dy=B0[j+1],dz=B0[j+2],d=dx*nx+dy*ny+dz*nz,a=-.8*d*s,o=.5*(1-d*d)*s;vv[j]+=nx*a+dx*o;vv[j+1]+=ny*a+dy*o;vv[j+2]+=nz*a+dz*o}}
function jig(b,dt){const pa=b.m.geometry.attributes.position.array,r=b.r,off=b.off,vv=b.vv,mx=.6*r;
const ax=Math.max(-120,Math.min(120,(b.v.x-b.pv.x)/dt)),ay=Math.max(-120,Math.min(120,(b.v.y-b.pv.y)/dt)),az=Math.max(-120,Math.min(120,(b.v.z-b.pv.z)/dt));
for(let i=0;i<NV;i++){const j=i*3,k=BK[i],w=BW[i];
vv[j]+=(-k*off[j]-5*vv[j]-ax*w)*dt;vv[j+1]+=(-k*off[j+1]-5*vv[j+1]-ay*w)*dt;vv[j+2]+=(-k*off[j+2]-5*vv[j+2]-az*w)*dt;
let ox=off[j]+vv[j]*dt,oy=off[j+1]+vv[j+1]*dt,oz=off[j+2]+vv[j+2]*dt;const l=Math.hypot(ox,oy,oz);if(l>mx){const f=mx/l;ox*=f;oy*=f;oz*=f}
off[j]=ox;off[j+1]=oy;off[j+2]=oz;pa[j]=B0[j]*r+ox;pa[j+1]=B0[j+1]*r+oy;pa[j+2]=B0[j+2]*r+oz}
b.m.geometry.attributes.position.needsUpdate=true}
function updBlobs(dt){
for(const b of blobs){const p=b.p,v=b.v,r=b.r;b.pv.copy(v);
const dxp=p.x-pos.x,dzp=p.z-pos.z;
if(dxp*dxp+dzp*dzp>230*230){const a=Math.random()*6.28,d=60+Math.random()*120,x=pos.x+Math.cos(a)*d,z=pos.z+Math.sin(a)*d;place(b,x,hf(x,z)+20,z,.5+Math.random()*.5,new T.Vector3());continue}
v.y-=22*dt;p.addScaledVector(v,dt);
const gh=hf(p.x,p.z);
if(p.y-r<0){v.multiplyScalar(1-2.5*dt);v.y+=(gh<0?34:20)*dt*Math.min(1,-(p.y-r)/r+.3)}
if(p.y-r<gh){let nx=hf(p.x-1,p.z)-hf(p.x+1,p.z),nz=hf(p.x,p.z-1)-hf(p.x,p.z+1);const l=Math.hypot(nx,2,nz);nx/=l;const ny=2/l;nz/=l;
p.y=gh+r;const vn_=v.x*nx+v.y*ny+v.z*nz;if(vn_<0){const e=-vn_>2?.55:0;v.x-=(1+e)*vn_*nx;v.y-=(1+e)*vn_*ny;v.z-=(1+e)*vn_*nz;hit(b,nx,ny,nz,-vn_)}
const f=Math.max(0,1-dt*.9);v.x*=f;v.z*=f}
const py=pos.y+Math.max(.35,Math.min(1.5,p.y-pos.y)),dx=p.x-pos.x,dy=p.y-py,dz=p.z-pos.z,d=Math.hypot(dx,dy,dz),m=r+.45;
if(d<m&&d>1e-4){const nx=dx/d,ny=dy/d,nz=dz/d;p.x=pos.x+nx*m;p.y=py+ny*m;p.z=pos.z+nz*m;const rel=(vel.x-v.x)*nx+(vel.y-v.y)*ny+(vel.z-v.z)*nz;if(rel>0){const s=rel*1.3+2;v.x+=nx*s;v.y+=ny*s;v.z+=nz*s;hit(b,-nx,-ny,-nz,rel+3)}}}
for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){const a=blobs[i],c=blobs[j],dx=c.p.x-a.p.x,dy=c.p.y-a.p.y,dz=c.p.z-a.p.z,m=a.r+c.r;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;const d=Math.hypot(dx,dy,dz);if(d<m&&d>1e-4){
const nx=dx/d,ny=dy/d,nz=dz/d,ma=a.r**3,mc=c.r**3,ov=m-d;a.p.x-=nx*ov*mc/(ma+mc);a.p.y-=ny*ov*mc/(ma+mc);a.p.z-=nz*ov*mc/(ma+mc);c.p.x+=nx*ov*ma/(ma+mc);c.p.y+=ny*ov*ma/(ma+mc);c.p.z+=nz*ov*ma/(ma+mc);
const rv=(c.v.x-a.v.x)*nx+(c.v.y-a.v.y)*ny+(c.v.z-a.v.z)*nz;if(rv<0){const J=-(1.6)*rv/(1/ma+1/mc);a.v.x-=J*nx/ma;a.v.y-=J*ny/ma;a.v.z-=J*nz/ma;c.v.x+=J*nx/mc;c.v.y+=J*ny/mc;c.v.z+=J*nz/mc;hit(a,-nx,-ny,-nz,-rv);hit(c,nx,ny,nz,-rv)}}}
for(const b of blobs){jig(b,dt);b.face.rotation.y=Math.atan2(pos.x-b.p.x,pos.z-b.p.z)}}
function shoot(){const b=blobs[nextB++%blobs.length],d=new T.Vector3(0,0,-1).applyEuler(C.rotation);place(b,C.position.x+d.x*1.4,C.position.y+d.y*1.4-.2,C.position.z+d.z*1.4,.45+Math.random()*.45,d.multiplyScalar(32).add(vel))}
/* ---------- anime girls with jiggling twin-tails ---------- */
const hairIM=new T.InstancedMesh(sph,new T.MeshToonMaterial({gradientMap:grad}),700);hairIM.frustumCulled=false;hairIM.instanceMatrix.setUsage(T.DynamicDrawUsage);S.add(hairIM);
const legG=new T.CylinderGeometry(1,1,1,8).translate(0,-.5,0),skG=new T.CylinderGeometry(.6,1,1,10),skin=M(0xffe3d3),whiteM=M(0xffffff);
const npcs=[];let hi=0;const CL=8,SEGL=.17;
function mkChain(h,ax,ay,az,dx,dy,dz,n,k,s0){const l=Math.hypot(dx,dy,dz),st=hi;hi+=n;const c=new T.Color(h);for(let i=0;i<n;i++)hairIM.setColorAt(st+i,c);
return{ax,ay,az,dx:dx/l,dy:dy/l,dz:dz/l,n,k,st,s0,x:new Float32Array(n),y:new Float32Array(n),z:new Float32Array(n),px:new Float32Array(n),py:new Float32Array(n),pz:new Float32Array(n),init:false}}
function mkNPC(){const g=new T.Group(),hc=new T.Color().setHSL(Math.random(),.75,.62),sk=new T.Color().setHSL(Math.random(),.6,.62),hm=M(hc),ir=M(new T.Color().setHSL(Math.random(),.9,.55));
part(skG,new T.MeshStandardMaterial({color:sk,roughness:.82}),[.34,.45,.34],[0,.62,0],g);part(cylB,whiteM,[.2,.5,.15],[0,.88,0],g);
const l1=part(legG,skin,[.07,.5,.07],[-.1,.5,0],g),l2=part(legG,skin,[.07,.5,.07],[.1,.5,0],g);
const a1=part(legG,skin,[.055,.45,.055],[-.26,1.35,0],g),a2=part(legG,skin,[.055,.45,.055],[.26,1.35,0],g);
part(sph,skin,[.3,.32,.3],[0,1.68,0],g);part(sph,new T.MeshStandardMaterial({color:hc,roughness:.82}),[.34,.34,.34],[0,1.72,-.04],g);part(sph,new T.MeshStandardMaterial({color:hc,roughness:.82}),[.33,.14,.2],[0,1.86,.14],g);
for(const s of[-1,1]){part(sph,ir,[.075,.11,.04],[s*.11,1.66,.28],g);part(sph,whiteM,[.025,.03,.02],[s*.11+.02,1.7,.31],g)}
part(sph,M(sk),[.08,.05,.04],[0,1.3,.17],g);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});S.add(g);
const hh=hc.getHex();
const n={g,a2,l1,l2,x:0,z:0,h:Math.random()*6.28,ph:Math.random()*9,tm:0,chains:[mkChain(hh,-.3,1.85,-.05,-.8,-.5,-.35,CL,.06,.13),mkChain(hh,.3,1.85,-.05,.8,-.5,-.35,CL,.06,.13),mkChain(hh,0,2.0,.05,0,1,.3,4,.25,.07)]};
npcs.push(n);return n}
function respawn(n,near){for(let i=0;i<30;i++){const a=Math.random()*6.28,d=near?10+Math.random()*80:70+Math.random()*100,x=pos.x+Math.cos(a)*d,z=pos.z+Math.sin(a)*d;if(hf(x,z)>1.2){n.x=x;n.z=z;n.chains.forEach(c=>c.init=false);return}}}
for(let i=0;i<22;i++)respawn(mkNPC(),true);
function stepChain(c,n,dt){const sy=Math.sin(n.h),cy=Math.cos(n.h),ax=n.x+c.ax*cy+c.az*sy,ay=n.y+c.ay,az=n.z-c.ax*sy+c.az*cy,dx=c.dx*cy+c.dz*sy,dz=-c.dx*sy+c.dz*cy,dy=c.dy;
const wx=Math.sin(t*.7)*3+Math.sin(t*2.3)*1.5,wz=Math.cos(t*.5)*2;
if(!c.init){for(let i=0;i<c.n;i++){c.x[i]=c.px[i]=ax+dx*SEGL*i;c.y[i]=c.py[i]=ay+dy*SEGL*i;c.z[i]=c.pz[i]=az+dz*SEGL*i}c.init=true}
c.x[0]=ax;c.y[0]=ay;c.z[0]=az;
for(let i=1;i<c.n;i++){const vx=(c.x[i]-c.px[i])*.95,vy=(c.y[i]-c.py[i])*.95,vz=(c.z[i]-c.pz[i])*.95;c.px[i]=c.x[i];c.py[i]=c.y[i];c.pz[i]=c.z[i];
const rx=ax+dx*SEGL*i,ry=ay+dy*SEGL*i,rz=az+dz*SEGL*i;
c.x[i]+=vx+wx*dt*dt+(rx-c.x[i])*c.k;c.y[i]+=vy-12*dt*dt+(ry-c.y[i])*c.k;c.z[i]+=vz+wz*dt*dt+(rz-c.z[i])*c.k}
for(let it=0;it<3;it++)for(let i=1;i<c.n;i++){const ex=c.x[i]-c.x[i-1],ey=c.y[i]-c.y[i-1],ez=c.z[i]-c.z[i-1],l=Math.hypot(ex,ey,ez)||1e-4,f=SEGL/l;c.x[i]=c.x[i-1]+ex*f;c.y[i]=c.y[i-1]+ey*f;c.z[i]=c.z[i-1]+ez*f}
for(let i=0;i<c.n;i++){const s=c.s0*(1.15-.8*i/c.n)*(c.n>5?1:.9);D.position.set(c.x[i],c.y[i],c.z[i]);D.scale.setScalar(s);D.rotation.set(0,0,0);D.updateMatrix();hairIM.setMatrixAt(c.st+i,D.matrix)}}
function updNPC(dt){for(const n of npcs){const dx=pos.x-n.x,dz=pos.z-n.z,d=Math.hypot(dx,dz);if(d>200)respawn(n,false);
let sp=0;n.tm-=dt;
if(d<16){n.h=Math.atan2(dx,dz);n.a2.rotation.z=Math.PI*.88+Math.sin(t*9+n.ph)*.45}
else{n.a2.rotation.z=0;if(n.tm<0){n.tm=2+Math.random()*4;n.h+=(Math.random()-.5)*2.2;n.walk=Math.random()<.7}if(n.walk)sp=2.2}

n.y=hf(n.x,n.z);n.ph+=sp*dt*4;n.l1.rotation.x=Math.sin(n.ph)*.6*(sp>0);n.l2.rotation.x=-Math.sin(n.ph)*.6*(sp>0);

/* ---------- init blobs ---------- */
for(let i=0;i<80;i++){const b=mkBlob();const a=Math.random()*6.28,d=8+Math.random()*60,x=pos.x+Math.cos(a)*d,z=pos.z+Math.sin(a)*d;place(b,x,Math.max(hf(x,z),0)+8+Math.random()*20,z,.5+Math.random()*.55,new T.Vector3())}

const hud=document.getElementById('hud');let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.033)||.016;last=now;t+=dt;frame++;
updPlayer(dt);streamChunks(pos.x,pos.z,frame<40?10:2);updBlobs(dt);updNPC(dt);
